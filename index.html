<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>NoteBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <nav id="menu" class="w-full text-center bg-neutral-900">
    <h1 class="text-4xl font-bold text-blue-400">Notes</h1>
  </nav>


  <div id="tools"
    class="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-3 px-5 py-2.5 backdrop-blur-xs rounded-xl border border-blue-500/10 shadow-2xl z-30">
    <button id="clear"
      class="p-2 rounded-full hover:bg-white/10 transition-all duration-200 text-slate-300 hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" class="bi bi-arrow-repeat"
        viewBox="0 0 16 16">
        <path
          d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9" />
        <path fill-rule="evenodd"
          d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z" />
      </svg>
    </button>

    <button id="change-color"
      class="w-9 h-9 rounded-full border-2 border-white/30 bg-blue-500 shadow-lg shadow-blue-500/30 hover:scale-110 transition-all duration-200"></button>

    <svg id="lastik" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
      class="bi bi-eraser text-slate-400 hover:text-red-400 transition-all duration-200 cursor-pointer p-1 hover:bg-white/10 rounded-full"
      viewBox="0 0 20 20">
      <path
        d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z" />
    </svg>

    <button id="new-page"
      class="px-4 py-1.5 rounded-full bg-blue-500/20 border border-blue-400/40 text-blue-200 font-medium hover:bg-blue-500/40 hover:text-white transition-all duration-200 text-sm">
      new page
    </button>
    <button id="export-pdf"
      class="px-4 py-1.5 rounded-full bg-green-500/20 border border-green-400/40 text-green-200 font-medium hover:bg-green-500/40 hover:text-white transition-all duration-200 text-sm">
      export PDF
    </button>
  </div>
  <main id="main">


    <div id="pages" class="flex pr-10 space-y-5 flex-col place-items-center">
      <canvas id="black-board"></canvas>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
  <script type="module" src="src/copmonents/new-page.js"></script>
  <script type="module" src="src/copmonents/clear.js"></script>
  <script type="module" src="/src/copmonents/export.js"></script>
</body>

</html>
