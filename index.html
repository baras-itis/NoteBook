      <div>
        <div id = "current-color">
        </div>
         <button id="clearButton" style = "max-height: 100px; max-width: 100px; padding:0; position:absolute; right:0; left:1;">Clear</button>
      <button id = "swap-button">Swap colors</button>
      </div>
      </div>
    </main>
