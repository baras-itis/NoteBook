<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>NoteBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
</head>

<body>
  <nav id="menu" class="w-full">
    <ul class="w-full flex place-content-between px-5 text-lg">
      <li class="text-red-900 font-bold">Desk</li>
      <li>
        <h1 class="text-4xl font-bold text-blue-400">Notes</h1>
      </li>
      <li><a href="todo.html">ToDo</a></li>
    </ul>
  </nav>
  <header id="header"
    class="w-full border flex bg-neutral-900/90 text-white place-content-between px-5 place-items-center py-5">

  </header>

  <div id="tools" class="fixed text-white flex right-0 space-x-3 place-items-end border p-5 rounded-full">
    <button id="clear">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-repeat"
        viewBox="0 0 16 16">
        <path
          d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9" />
        <path fill-rule="evenodd"
          d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z" />
      </svg></button>
    <button id="change-color" class="w-10 border h-10"></button>
    <script type="module" src="src/copmonents/changeColor.js"></script>
    <button id="lastik">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eraser"
        viewBox="0 0 16 16">
        <path
          d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z" />
      </svg>
    </button>
    <button id="new-page">
      new page
    </button>
  </div>
  <main id="main">


    <div id="pages" class="px-20 flex space-y-5 flex-col place-items-center">
      <canvas id="black-board"></canvas>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
  <script type="module" src="src/copmonents/new-page.js"></script>
  <script type="module" src="src/copmonents/clear.js"></script>
</body>

</html>
