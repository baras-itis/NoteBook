<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Black Board</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
  </head>
  <body>
    <main id="main">
      <div
        style="
          display: grid;
          position: relative;
          grid-template-columns: 1fr 1fr 1fr;
          grid-template-rows: 1fr 1fr;
        "
      >
        <style>
          ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            border: 1px solid black;
            width: 20px;
            border-radius: 2rem;
            padding: 12%;
          }
        </style>
        <nav
          id="navigation-menu"
          style="
          border-radius:5rem;
          margin:10px 0 0 10px;
            display: grid;
            gap:20px;
            place-content: center;
            width: 60px;
            border: 1px solid black;
            height: 400px;
            place-items: center;
            background-color: rgba(0,0,0);
          "
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="currentColor"
            class="bi bi-tablet-landscape-fill"
            viewBox="0 0 16 16"
            style="color: #9381ff"
            
            id = "clearIcon"
          >
            <path
              d="M2 14a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2zm11-7a1 1 0 1 0 0 2 1 1 0 0 0 0-2"
            />
          </svg>
            <button
            id="clearButton"
            style="
              background: #b8b8ff;
              border-radius: 10px;
              border: none;
              color: white;

              padding: 0;
             
            "
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="30"
              height="30"
              fill="currentColor"
              class="bi bi-arrow-counterclockwise"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"
              />
              <path
                d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"
              />
            </svg>
          </button>
        </nav>

        <script>
          const navbar = document.getElementById("nav-bar");
        </script>

        <canvas
          id="black-board"
          class="blackboard"
          style="
            border: 1px solid black;
            background-color: white;
            border-radius: 2rem;
            grid-column-start: 2;
          "
        ></canvas>

        <div>
          <div
            id="current-color"
            style="background-color: black; width: 50px; height: 50px"
          ></div>
        
          <button id="swap-button">Swap colors</button>
        </div>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
