<!doctype html>
<html>
  <head></head>
  <body>
    <canvas
      id="myCanvas"
      width="900px"
      height="300px"
      style="border: 1px solid black"
    ></canvas>
    <img src="" alt="" />
    <script>
      // HTMLCanvasElement.getContext() - возвращает контекст рисования на холсте или `null` если идентификатор контекста не определен
      // canvas.getContext(contextType, contextAttributes);

      /* contextType:
        -  2d -> (object) CanvasRenderingContext2D двумерный контекст
        - webGL -> OpenGL ES 2.0
        - webGL2 -> OpenGL ES 3.0
        - bitmaprenderer -> ImageBitMapRenderingContext, функции только для замены содержимого холста с заданным ImageBitMap

        2D аттрибуты:
        - alpha -> прозрачность

        WebGL:
        - alpha
        - depth -> буфер глубины минимум 16 бит
        - stencil -> stencil buffer минимум 8 бит
        - antialias: булево значение определяющее делать ли сглаживние
        - premultipliedAlpha - булево указывает на
        - preserveDrawingBuffer: Если значение равно true, буферы не будут очищены и сохранят свои значения до тех пор, пока не будут очищены или перезаписаны автором.
        - failIfMajorPerformanceCaveat: Логическое значение, указывающее, будет ли создан контекст при низкой производительности системы.
        */
      const canvas = document.getElementById("myCanvas");
      const context = canvas.getContext("2d");
      // Lines
      context.moveTo(20, 20); // Начало первой линии х - 20, y - 20
      context.lineTo(200, 20); // Конец первой линии в контексте х - 200, y - 20
      context.moveTo(50, 90);
      context.lineTo(200, 20);
      context.stroke();
      // Circle
      context.beginPath(); // Начало нового пути
      context.arc(200, 175, 10, 11, 4); //  x y r startingAngle 0-3o'clock  eangle-endRadians counterclockwise против или почасовой
      context.stroke();
      // Text
      context.font = "30px Arial";
      context.fillText("Helo World", 200, 200); // Текст с заполеннием
      context.strokeText("Hello Stroke World", 200, 50);

      // Liner Gradient
      // createLinearGradient - создаёт градиент между двумя координатами x1,y1, x2,y2
      const gradient = context.createLinearGradient(75, 50, 5, 90, 60, 100);
      //Метод CanvasGradient.addColorStop() добавляет новую цветовую точку, определяемую смещением и цветом, к заданному градиенту холста.

      gradient.addColorStop(0, "red");
      gradient.addColorStop(1, "white");

      // Fill with gradient
      /* 
        Свойство CanvasRenderingContext2D.fillStyle в API Canvas 2D задает цвет, градиент или узор, используемые внутри фигур. Стиль по умолчанию — черный.
        */
      context.fillStyle = gradient;
      context.fillRect(10, 10, 150, 80); // метод рисует заполненый прямоугольник который начинается с 0,0 размером 1920x80
    </script>
  </body>
</html>
